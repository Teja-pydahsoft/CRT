services:
  mongodb:
    image: mongo:6.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-crt}
    volumes:
      - mongodb_data:/data/db
    mem_limit: 320m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  ai-server:
    image: ${AI_SERVER_IMAGE:-versant-ai-server:latest}
    build:
      context: ./ai-server
    restart: unless-stopped
    environment:
      AI_SERVER_PORT: 8001
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
      HF_HOME: /models
      HF_HUB_CACHE: /models/hub
    volumes:
      - ai_model_cache:/models
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:-versant-backend:latest}
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8000
      NODE_OPTIONS: --max-old-space-size=160
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-crt}?authSource=admin
      HRMS_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/hrms?authSource=admin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?Set JWT_REFRESH_SECRET_KEY in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AI_SERVER_URL: http://ai-server:8001
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-noreply@versant.com}
      SENDER_NAME: ${SENDER_NAME:-VERSANT Testing System}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-student_database}
      DB_SSL: ${DB_SSL:-false}
      USE_RDS_ORG_DATA: ${USE_RDS_ORG_DATA:-false}
      MYSQL_RDS_READ_ONLY: ${MYSQL_RDS_READ_ONLY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,https://crt.pydahsoft.in}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-versant-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  ai_model_cache:
